<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Drive – Car Rental in Morocco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-stone-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
    <a href="#home" class="font-display text-xl font-extrabold"><i class="fa-solid fa-road accent-text"></i> Atlas Drive</a>
    <nav class="flex gap-1 text-sm font-medium order-3 w-full sm:order-none sm:w-auto">
      <a data-nav="home" href="#home" class="navlink" data-i18n="home"></a>
      <a data-nav="track" href="#track" class="navlink" data-i18n="track"></a>
      <a data-nav="admin" href="#admin" class="navlink" data-i18n="admin"></a>
    </nav>
    <div class="flex items-center gap-2 text-sm">
      <select id="lang" aria-label="Language" class="ctl"><option value="en">EN</option><option value="fr">FR</option><option value="ar">العربية</option></select>
      <select id="cur" aria-label="Currency" class="ctl"><option>USD</option><option>EUR</option><option>MAD</option></select>
      <input id="accent" type="color" aria-label="Accent color" class="w-8 h-8 rounded cursor-pointer border border-stone-300 p-0">
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <!-- HOME -->
  <section id="view-home" class="view">
    <div class="hero rounded-2xl p-6 sm:p-12 text-white mb-6">
      <h1 class="font-display text-3xl sm:text-5xl font-extrabold max-w-xl" data-i18n="hero"></h1>
      <p class="mt-3 max-w-lg opacity-90" data-i18n="heroSub"></p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-6">
      <input id="q" class="ctl sm:col-span-1" data-i18n-ph="search">
      <select id="fcat" class="ctl"></select>
      <select id="floc" class="ctl"></select>
      <button id="reset" class="ctl font-medium" data-i18n="reset"></button>
    </div>
    <div id="cars" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    <h2 class="font-display text-2xl font-bold mt-12 mb-3" data-i18n="locations"></h2>
    <div class="grid md:grid-cols-3 gap-4">
      <div id="map" class="map md:col-span-2" role="img" aria-label="Map"></div>
      <div id="citylist" class="space-y-2"></div>
    </div>
  </section>

  <!-- TRACK -->
  <section id="view-track" class="view hidden max-w-xl mx-auto">
    <h2 class="font-display text-2xl font-bold mb-3" data-i18n="trackTitle"></h2>
    <div class="flex gap-2">
      <input id="tid" class="ctl flex-1" placeholder="#CR-1234">
      <button id="tbtn" class="btn" data-i18n="check"></button>
    </div>
    <div id="tres" class="mt-5"></div>
  </section>

  <!-- ADMIN -->
  <section id="view-admin" class="view hidden">
    <div id="admin-body"></div>
  </section>
</main>

<!-- BOOKING MODAL -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="modal-box bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3">
      <h3 id="m-title" class="font-display text-xl font-bold"></h3>
      <button id="m-close" aria-label="Close" class="text-2xl leading-none px-2">&times;</button>
    </div>
    <div id="m-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<footer class="text-center text-xs text-stone-500 py-8">&copy; <span id="yr"></span> Atlas Drive</footer>
<script src="app.js"></script>
</body>
</html>
